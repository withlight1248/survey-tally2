<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>옷입히기</title>
</head>
<body>
<!-- 화면은 다음 커밋에서 추가한다. -->

<script id="outfit-logic">
/*
 * 옷 입기 규칙. 화면을 전혀 쓰지 않는 순수 함수만 둔다.
 * 시험(tests/)은 이 블록만 꺼내 Node에서 실행한다.
 *
 * 상태(outfit): { dress: 옷 아이디 또는 null, top: ..., bottom: ... }
 * 상태는 바꾸지 않고, 입거나 벗을 때마다 새 상태를 돌려준다.
 */
(function (root) {
  'use strict';

  var CATEGORIES = [
    { id: 'dress', name: '드레스' },
    { id: 'top', name: '상의' },
    { id: 'bottom', name: '하의' }
  ];

  var ITEMS = [
    { id: 'dress-pink', category: 'dress', name: '분홍 원피스' },
    { id: 'dress-blue', category: 'dress', name: '파란 롱드레스' },
    { id: 'dress-yellow', category: 'dress', name: '노란 물방울 원피스' },
    { id: 'dress-purple', category: 'dress', name: '보라 파티 드레스' },
    { id: 'top-white', category: 'top', name: '흰 티셔츠' },
    { id: 'top-pink', category: 'top', name: '분홍 블라우스' },
    { id: 'top-yellow', category: 'top', name: '노란 줄무늬 니트' },
    { id: 'top-blue', category: 'top', name: '파란 민소매' },
    { id: 'bottom-jeans', category: 'bottom', name: '청바지' },
    { id: 'bottom-red', category: 'bottom', name: '빨간 치마' },
    { id: 'bottom-pleat', category: 'bottom', name: '검정 플리츠 스커트' },
    { id: 'bottom-shorts', category: 'bottom', name: '초록 반바지' }
  ];

  function findItem(id) {
    for (var i = 0; i < ITEMS.length; i++) {
      if (ITEMS[i].id === id) return ITEMS[i];
    }
    return null;
  }

  function itemsOf(categoryId) {
    return ITEMS.filter(function (item) { return item.category === categoryId; });
  }

  /** 아무것도 안 입은 기본 상태. */
  function emptyOutfit() {
    return { dress: null, top: null, bottom: null };
  }

  /**
   * 옷을 입히거나(이미 입은 옷이면) 벗긴다. 새 상태를 돌려준다.
   * - 드레스를 입으면 상의·하의가 벗겨진다.
   * - 상의나 하의를 입으면 드레스가 벗겨진다. 상의와 하의는 함께 입을 수 있다.
   * - 모르는 아이디는 무시하고 원래 상태를 그대로 돌려준다.
   */
  function wear(outfit, itemId) {
    var item = findItem(itemId);
    if (!item) return outfit;

    var next = { dress: outfit.dress, top: outfit.top, bottom: outfit.bottom };
    if (outfit[item.category] === item.id) {
      next[item.category] = null;
      return next;
    }
    next[item.category] = item.id;
    if (item.category === 'dress') {
      next.top = null;
      next.bottom = null;
    } else {
      next.dress = null;
    }
    return next;
  }

  /** 입은 옷 이름을 쉼표로 이은 문장. 아무것도 없으면 '기본 차림'. */
  function describe(outfit) {
    var names = [];
    CATEGORIES.forEach(function (cat) {
      var item = outfit[cat.id] ? findItem(outfit[cat.id]) : null;
      if (item) names.push(item.name);
    });
    return names.length === 0 ? '기본 차림' : names.join(', ');
  }

  root.Outfit = {
    CATEGORIES: CATEGORIES,
    ITEMS: ITEMS,
    findItem: findItem,
    itemsOf: itemsOf,
    emptyOutfit: emptyOutfit,
    wear: wear,
    describe: describe
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>

<script id="dress-art">
/*

 * 도형은 [태그, 속성] 쌍이고, 좌표는 가로 300 × 세로 520 그림판 기준이다.

  function merge(base, extra) {

      for (var key in extra) base[key] = extra[key];
    }

  }
  function path(d, fill, extra) {
    return ['path', merge({ d: d, fill: fill, stroke: LINE, 'stroke-width': 1.5, 'stroke-linejoin': 'round' }, extra)];

  function line(x1, y1, x2, y2, stroke, width) {

  function circle(cx, cy, r, fill, extra) {

  }
  function ellipse(cx, cy, rx, ry, fill, extra) {
    return ['ellipse', merge({ cx: cx, cy: cy, rx: rx, ry: ry, fill: fill }, extra)];
  }
  function rect(x, y, width, height, fill, extra) {
    return ['rect', merge({ x: x, y: y, width: width, height: height, fill: fill }, extra)];

  /* ---------- 캐릭터 ---------- */

    under: [

      circle(138.5, 97.5, 1.7, '#ffffff'),
      circle(164.5, 97.5, 1.7, '#ffffff'),
      ellipse(128, 114, 7, 4, '#ff9fb2', { opacity: 0.55 }),
      ellipse(172, 114, 7, 4, '#ff9fb2', { opacity: 0.55 }),
      ['path', { d: 'M131 89 Q137 85 143 88', fill: 'none', stroke: HAIR, 'stroke-width': 2, 'stroke-linecap': 'round' }],
      ['path', { d: 'M157 88 Q163 85 169 89', fill: 'none', stroke: HAIR, 'stroke-width': 2, 'stroke-linecap': 'round' }],
      ['path', { d: 'M144 119 Q150 125 156 119', fill: 'none', stroke: '#b85c5c', 'stroke-width': 2, 'stroke-linecap': 'round' }]
    ],
    hairFront: [
      path('M109 100 Q104 48 150 47 Q196 48 191 100 Q188 76 170 68 Q160 82 144 72 Q122 76 109 100 Z', HAIR),
      path('M109 98 Q103 136 112 172 L121 172 Q113 136 119 104 Z', HAIR),
      path('M191 98 Q197 136 188 172 L179 172 Q187 136 181 104 Z', HAIR)
    ]
  };

  /* ---------- 옷 ---------- */
  function topBody(fill) {
    return path('M106 164 Q128 160 134 158 Q150 176 166 158 Q172 160 194 164 L190 286 Q150 294 110 286 Z', fill);
  }
  function shortSleeves(fill) {

  }

  function waistband(fill) {

  var garments = {

      path('M150 267 L134 258 L134 276 Z', '#e0749a'),

    'dress-blue': [

      ellipse(98, 186, 16, 14, '#7aa7e8', { stroke: LINE, 'stroke-width': 1.5 }),
      ellipse(202, 186, 16, 14, '#7aa7e8', { stroke: LINE, 'stroke-width': 1.5 }),
      rect(109, 262, 82, 9, '#4b74c4'),

    ],
    'dress-yellow': [
      path('M106 166 Q128 160 134 158 Q150 176 166 158 Q172 160 194 166 L192 266 L218 382 Q150 398 82 382 L108 266 Z', '#ffe07a'),
      path('M93 168 L115 172 L110 207 L88 203 Z', '#ffe07a'),
      path('M207 168 L185 172 L190 207 L212 203 Z', '#ffe07a'),
      circle(125, 214, 4, '#ffffff', { stroke: 'none' }),
      circle(172, 206, 4, '#ffffff', { stroke: 'none' }),
      circle(150, 250, 4, '#ffffff', { stroke: 'none' }),

    'dress-purple': [

    /* 상의 */
    'top-white': [topBody('#ffffff')].concat(shortSleeves('#ffffff')),
    'top-pink': [topBody('#f7a8c4')].concat(longSleeves('#f7a8c4'), [
      path('M150 174 L136 166 L136 182 Z', '#e0749a'),
      path('M150 174 L164 166 L164 182 Z', '#e0749a'),
      circle(150, 174, 4, '#c65582')
    ]),
    'top-yellow': [topBody('#f6d365')].concat(longSleeves('#f6d365'), [
      line(111, 200, 189, 200, '#e8b93f', 4),
      line(111, 220, 189, 220, '#e8b93f', 4),
      line(111, 240, 189, 240, '#e8b93f', 4),
      line(111, 260, 189, 260, '#e8b93f', 4)

    'top-blue': [
      path('M110 192 Q150 206 190 192 L190 286 Q150 294 110 286 Z', '#6fb3e8'),
      path('M121 194 L127 162 L135 162 L131 198 Z', '#6fb3e8'),
      path('M179 194 L173 162 L165 162 L169 198 Z', '#6fb3e8')
    ],

    /* 하의 */
    'bottom-jeans': [
      path('M104 336 H149 L141 468 H113 Z', '#4a6fa5'),
      path('M151 336 H196 L187 468 H159 Z', '#4a6fa5'),
      path('M110 272 H190 L198 340 H102 Z', '#4a6fa5'),
      waistband('#375580'),
      line(150, 282, 150, 340, '#375580', 2)
    ],
    'bottom-red': [
      path('M110 272 H190 L214 402 Q150 416 86 402 Z', '#d94b5b'),

    'bottom-pleat': [
      path('M110 272 H190 L206 362 Q150 374 94 362 Z', '#2e2e3a'),
      waistband('#1f1f29'),
      line(120, 282, 112, 366, '#4a4a5c', 2),
      line(135, 282, 131, 370, '#4a4a5c', 2),
      line(150, 282, 150, 372, '#4a4a5c', 2),
      line(165, 282, 169, 370, '#4a4a5c', 2),
      line(180, 282, 188, 366, '#4a4a5c', 2)
    ],
    'bottom-shorts': [
      path('M104 336 H149 L146 402 H108 Z', '#7cc68a'),
      path('M151 336 H196 L192 402 H154 Z', '#7cc68a'),
      path('M110 272 H190 L198 340 H102 Z', '#7cc68a'),
      waistband('#58a768')

  };

  root.DressArt = {
    viewBox: '0 0 300 520',
    character: character,
    garments: garments,
    // 진열대 작은 그림에서 종류별로 보여 줄 영역
    previewBox: {
      dress: '50 150 200 350',
      top: '66 150 168 150',
      bottom: '62 264 176 216'
    }
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
</body>
