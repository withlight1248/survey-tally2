<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 이 페이지는 어떤 외부 주소에도 연결하지 못하게 막아 둔다. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>옷입히기</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fdf6f9;
    --fg: #2a1f25;
    --muted: #6f5b66;
    --line: #ead3de;
    --card: #ffffff;
    --accent: #d6407f;
    --stage-top: #ffeaf3;
    --stage-bottom: #f8d7e6;
    --floor: rgba(120, 60, 90, 0.18);
    --tile: #fff7fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1820;
      --fg: #f6eaf0;
      --muted: #b9a2ae;
      --line: #4a3744;
      --card: #2a2029;
      --accent: #ff7fb0;
      --stage-top: #3a2b38;
      --stage-bottom: #4a3446;
      --floor: rgba(0, 0, 0, 0.3);
      --tile: #33262f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 14px 40px;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; text-align: center; }
  #status { margin: 0 0 16px; text-align: center; color: var(--muted); }
  #status strong { color: var(--accent); }

  /* 왼쪽 무대, 오른쪽 진열대. 좁은 화면에서는 위아래로 쌓는다. */
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 720px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
  }

  .stage {
    background: linear-gradient(180deg, var(--stage-top), var(--stage-bottom));
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px;
    display: flex;
    justify-content: center;
  }
  .stage svg { display: block; width: min(100%, 340px); height: auto; }

  .shelf { display: flex; flex-direction: column; gap: 14px; }
  .shelf-group {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 12px 12px;
  }
  .shelf-group h2 { margin: 0 0 8px; font-size: 1rem; }
  .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }

  button.item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 6px 4px 8px;
    border: 2px solid var(--line);
    border-radius: 10px;
    background: var(--tile);
    color: inherit;
    font: inherit;
    font-size: 0.78rem;
    line-height: 1.25;
    cursor: pointer;
  }
  button.item:hover { border-color: var(--accent); }
  button.item[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; font-weight: 600; }
  button.item svg { width: 100%; height: 84px; display: block; }
  button.item.dress svg { height: 112px; }

  .actions { margin: 16px 0 0; text-align: center; }
  button.reset {
    padding: 8px 18px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>옷입히기</h1>
  <p id="status" role="status" aria-live="polite"></p>

  <div class="layout">
    <div class="stage" id="stage"></div>
    <div class="shelf" id="shelf" role="group" aria-label="옷 진열대"></div>
  </div>

  <p class="actions"><button type="button" class="reset" id="reset">기본 차림으로</button></p>
  <noscript><p>이 게임은 자바스크립트가 필요합니다.</p></noscript>
</main>

<script id="outfit-logic">
/*
 * 옷 입기 규칙. 화면을 전혀 쓰지 않는 순수 함수만 둔다.
 * 시험(tests/)은 이 블록만 꺼내 Node에서 실행한다.
 *
 * 상태(outfit): { dress: 옷 아이디 또는 null, top: ..., bottom: ... }
 * 상태는 바꾸지 않고, 입거나 벗을 때마다 새 상태를 돌려준다.
 */
(function (root) {
  'use strict';

  var CATEGORIES = [
    { id: 'dress', name: '드레스' },
    { id: 'top', name: '상의' },
    { id: 'bottom', name: '하의' }
  ];

  var ITEMS = [
    { id: 'dress-pink', category: 'dress', name: '분홍 원피스' },
    { id: 'dress-blue', category: 'dress', name: '파란 롱드레스' },
    { id: 'dress-yellow', category: 'dress', name: '노란 물방울 원피스' },
    { id: 'dress-purple', category: 'dress', name: '보라 파티 드레스' },
    { id: 'top-white', category: 'top', name: '흰 티셔츠' },
    { id: 'top-pink', category: 'top', name: '분홍 블라우스' },
    { id: 'top-yellow', category: 'top', name: '노란 줄무늬 니트' },
    { id: 'top-blue', category: 'top', name: '파란 민소매' },
    { id: 'bottom-jeans', category: 'bottom', name: '청바지' },
    { id: 'bottom-red', category: 'bottom', name: '빨간 치마' },
    { id: 'bottom-pleat', category: 'bottom', name: '검정 플리츠 스커트' },
    { id: 'bottom-shorts', category: 'bottom', name: '초록 반바지' }
  ];

  function findItem(id) {
    for (var i = 0; i < ITEMS.length; i++) {
      if (ITEMS[i].id === id) return ITEMS[i];
    }
    return null;
  }

  function itemsOf(categoryId) {
    return ITEMS.filter(function (item) { return item.category === categoryId; });
  }

  /** 아무것도 안 입은 기본 상태. */
  function emptyOutfit() {
    return { dress: null, top: null, bottom: null };
  }

  /**
   * 옷을 입히거나(이미 입은 옷이면) 벗긴다. 새 상태를 돌려준다.
   * - 드레스를 입으면 상의·하의가 벗겨진다.
   * - 상의나 하의를 입으면 드레스가 벗겨진다. 상의와 하의는 함께 입을 수 있다.
   * - 모르는 아이디는 무시하고 원래 상태를 그대로 돌려준다.
   */
  function wear(outfit, itemId) {
    var item = findItem(itemId);
    if (!item) return outfit;

    var next = { dress: outfit.dress, top: outfit.top, bottom: outfit.bottom };
    if (outfit[item.category] === item.id) {
      next[item.category] = null;
      return next;
    }
    next[item.category] = item.id;
    if (item.category === 'dress') {
      next.top = null;
      next.bottom = null;
    } else {
      next.dress = null;
    }
    return next;
  }

  /** 입은 옷 이름을 쉼표로 이은 문장. 아무것도 없으면 '기본 차림'. */
  function describe(outfit) {
    var names = [];
    CATEGORIES.forEach(function (cat) {
      var item = outfit[cat.id] ? findItem(outfit[cat.id]) : null;
      if (item) names.push(item.name);
    });
    return names.length === 0 ? '기본 차림' : names.join(', ');
  }

  root.Outfit = {
    CATEGORIES: CATEGORIES,
    ITEMS: ITEMS,
    findItem: findItem,
    itemsOf: itemsOf,
    emptyOutfit: emptyOutfit,
    wear: wear,
    describe: describe
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>

<script id="dress-ui">
/* 화면: 그림 데이터로 SVG를 만들고, 진열대 클릭을 Outfit에 넘긴다. 규칙은 판단하지 않는다. */
(function () {
  'use strict';

  var SVG_NS = 'http://www.w3.org/2000/svg';

  var stageEl = document.getElementById('stage');
  var shelfEl = document.getElementById('shelf');
  var statusEl = document.getElementById('status');
  var resetButton = document.getElementById('reset');

  var outfit = Outfit.emptyOutfit();
  var layers = {};      // 종류 → 옷이 그려지는 <g>
  var buttons = {};     // 옷 아이디 → 진열대 <button>

  function svgEl(tag, attrs) {
    var node = document.createElementNS(SVG_NS, tag);
    if (attrs) {
      for (var name in attrs) node.setAttribute(name, String(attrs[name]));
    }
    return node;
  }

  function shapesInto(parent, shapes) {
    shapes.forEach(function (shape) {
      parent.appendChild(svgEl(shape[0], shape[1]));
    });
  }

  function layer(parent, shapes) {
    var g = svgEl('g');
    if (shapes) shapesInto(g, shapes);
    parent.appendChild(g);
    return g;
  }

  /* ---------- 무대(캐릭터) ---------- */
  function buildStage() {
    var svg = svgEl('svg', { viewBox: DressArt.viewBox, role: 'img', 'aria-label': '옷을 입힐 여자 캐릭터' });
    svg.appendChild(svgEl('ellipse', { cx: 150, cy: 494, rx: 95, ry: 12, fill: 'rgba(120, 60, 90, 0.18)' }));
    layer(svg, DressArt.character.hairBack);
    layer(svg, DressArt.character.body);
    layer(svg, DressArt.character.under);
    // 입히는 순서: 하의 → 상의 → 드레스 (나중에 그린 것이 위에 덮인다)
    layers.bottom = layer(svg);
    layers.top = layer(svg);
    layers.dress = layer(svg);
    layer(svg, DressArt.character.head);
    layer(svg, DressArt.character.hairFront);
    stageEl.appendChild(svg);
  }

  /* ---------- 진열대 ---------- */
  function buildPreview(item) {
    var svg = svgEl('svg', {
      viewBox: DressArt.previewBox[item.category],
      'aria-hidden': 'true',
      focusable: 'false',
      preserveAspectRatio: 'xMidYMid meet'
    });
    shapesInto(svg, DressArt.garments[item.id]);
    return svg;
  }

  function buildShelf() {
    Outfit.CATEGORIES.forEach(function (category) {
      var group = document.createElement('section');
      group.className = 'shelf-group';
      var title = document.createElement('h2');
      title.textContent = category.name;
      group.appendChild(title);

      var grid = document.createElement('div');
      grid.className = 'items';
      Outfit.itemsOf(category.id).forEach(function (item) {
        var button = document.createElement('button');
        button.type = 'button';
        button.className = 'item ' + category.id;
        button.setAttribute('data-id', item.id);
        button.setAttribute('aria-pressed', 'false');
        button.appendChild(buildPreview(item));
        var label = document.createElement('span');
        label.textContent = item.name;
        button.appendChild(label);
        grid.appendChild(button);
        buttons[item.id] = button;
      });
      group.appendChild(grid);
      shelfEl.appendChild(group);
    });
  }

  /* ---------- 다시 그리기 ---------- */
  function render() {
    Outfit.CATEGORIES.forEach(function (category) {
      var g = layers[category.id];
      while (g.firstChild) g.removeChild(g.firstChild);
      var id = outfit[category.id];
      if (id) shapesInto(g, DressArt.garments[id]);
    });

    Outfit.ITEMS.forEach(function (item) {
      var worn = outfit[item.category] === item.id;
      buttons[item.id].setAttribute('aria-pressed', worn ? 'true' : 'false');
    });

    statusEl.textContent = '';
    var label = document.createElement('span');
    label.textContent = '입은 옷: ';
    var names = document.createElement('strong');
    names.textContent = Outfit.describe(outfit);
    statusEl.appendChild(label);
    statusEl.appendChild(names);
  }

  shelfEl.addEventListener('click', function (event) {
    var button = event.target.closest ? event.target.closest('button.item') : null;
    if (!button) return;
    outfit = Outfit.wear(outfit, button.getAttribute('data-id'));
    render();
  });
  resetButton.addEventListener('click', function () {
    outfit = Outfit.emptyOutfit();
    render();
  });

  buildStage();
  buildShelf();
  render();
})();
</script>
</body>
</html>
