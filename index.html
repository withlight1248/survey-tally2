<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 이 페이지는 어떤 외부 주소에도 연결하지 못하게 막아 둔다(붙여넣은 데이터가 밖으로 나가지 않도록). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>설문 집계기</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafaf9;
    --fg: #1c1917;
    --muted: #57534e;
    --line: #d6d3d1;
    --head: #f0efed;
    --accent: #0f766e;
    --field: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917;
      --fg: #f5f5f4;
      --muted: #a8a29e;
      --line: #44403c;
      --head: #292524;
      --accent: #5eead4;
      --field: #23201e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .lead { margin: 0 0 20px; color: var(--muted); }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  textarea {
    width: 100%;
    min-height: 180px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--field);
    color: inherit;
    font: 0.9rem/1.45 ui-monospace, "SF Mono", Menlo, Consolas, "D2Coding", monospace;
    white-space: pre;
    overflow: auto;
    resize: vertical;
  }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .actions { margin: 8px 0 0; }
  button {
    padding: 6px 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--field);
    color: inherit;
    font: inherit;
    cursor: pointer;
  }
  #result { margin-top: 24px; }
  .hint { color: var(--muted); margin: 0; }
  .summary { margin: 0 0 8px; color: var(--muted); }
  .table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 480px; }
  th, td { border: 1px solid var(--line); padding: 7px 12px; text-align: left; vertical-align: top; }
  thead th { background: var(--head); font-weight: 600; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .name { white-space: pre-wrap; overflow-wrap: anywhere; }
  .privacy { margin-top: 28px; font-size: 0.85rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>설문 집계기</h1>
  <p class="lead">엑셀에서 머리글 줄까지 복사해 아래에 붙여넣으면 문항별 결과가 나옵니다.</p>

  <label for="input">붙여넣기</label>
  <textarea id="input" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="응답번호&#9;문항1&#9;문항2&#10;1&#9;5&#9;4&#10;2&#9;3&#9;"></textarea>
  <p class="actions"><button type="button" id="clear">지우기</button></p>

  <section id="result" aria-live="polite"></section>

  <p class="privacy">붙여넣은 데이터는 이 브라우저 탭 안에서만 계산하며, 밖으로 보내거나 저장하지 않습니다. 첫 열(응답번호)은 집계하지 않고, 1·2·3·4·5만 유효 응답으로 봅니다.</p>
  <noscript><p>이 도구는 자바스크립트가 필요합니다.</p></noscript>
</main>

<script id="tally-logic">
/*
 * 계산 로직. 화면(document, window 등)을 전혀 쓰지 않는 순수 함수만 둔다.
 * 시험(tests/)은 이 블록만 꺼내 Node에서 실행한다.
 */
(function (root) {
  'use strict';

  var VALID_VALUES = ['1', '2', '3', '4', '5'];

  /**
   * 엑셀에서 복사한 글(탭으로 칸, 줄바꿈으로 줄)을 칸 배열의 배열로 나눈다.
   * 칸이 따옴표로 시작하면 그 안의 탭·줄바꿈은 글자로 읽고, "" 는 " 하나로 읽는다.
   */
  function parseTsv(text) {
    text = String(text == null ? '' : text);
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);

    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    var atFieldStart = true;
    var i = 0;
    var n = text.length;
    var c;

    while (i < n) {
      c = text.charAt(i);
      if (inQuotes) {
        if (c === '"') {
          if (text.charAt(i + 1) === '"') { field += '"'; i += 2; continue; }
          inQuotes = false;
          i += 1;
          continue;
        }
        field += c;
        i += 1;
        continue;
      }
      if (c === '"' && atFieldStart) {
        inQuotes = true;
        atFieldStart = false;
        i += 1;
        continue;
      }
      if (c === '\t') {
        row.push(field);
        field = '';
        atFieldStart = true;
        i += 1;
        continue;
      }
      if (c === '\n' || c === '\r') {
        if (c === '\r' && text.charAt(i + 1) === '\n') i += 1;
        row.push(field);
        rows.push(row);
        row = [];
        field = '';
        atFieldStart = true;
        i += 1;
        continue;
      }
      field += c;
      atFieldStart = false;
      i += 1;
    }
    if (field !== '' || row.length > 0) {
      row.push(field);
      rows.push(row);
    }
    return rows;
  }

  /**
   * 칸 하나를 판정한다. 앞뒤 공백을 지운 값으로 본다.
   * 'valid' (1~5), 'blank' (비었거나 공백뿐, 칸이 없는 경우 포함), 'excluded' (그 밖).
   */
  function classifyCell(cell) {
    if (cell === undefined || cell === null) return 'blank';
    var t = String(cell).trim();
    if (t === '') return 'blank';
    if (VALID_VALUES.indexOf(t) !== -1) return 'valid';
    return 'excluded';
  }

  /**
   * 평균 문자열. 유효 응답의 합 ÷ 유효 응답 수를 소수 셋째 자리에서 반올림(0.5는 올림)해
   * 둘째 자리까지. 유효가 0이면 '-'. 부동소수점 오차를 피하려고 정수로만 계산한다.
   */
  function formatAverage(sum, count) {
    if (count === 0) return '-';
    var hundredths = Math.floor((2 * sum * 100 + count) / (2 * count));
    var whole = Math.floor(hundredths / 100);
    var frac = hundredths % 100;
    return whole + '.' + (frac < 10 ? '0' : '') + frac;
  }

  function isEmptyRow(row) {
    for (var i = 0; i < row.length; i++) {
      if (String(row[i]).trim() !== '') return false;
    }
    return true;
  }

  /**
   * 붙여넣은 글 전체를 집계한다.
   * 반환: { respondents: 응답자 수, questions: [{ name, valid, average, blank, excluded }] }
   * 첫 줄은 머리글, 첫 열(응답번호)은 집계하지 않는다.
   * 모든 칸이 빈 줄은 건너뛴다. 머리글보다 많은 칸은 무시한다.
   */
  function tally(text) {
    var rows = parseTsv(text).filter(function (r) { return !isEmptyRow(r); });
    if (rows.length === 0) return { respondents: 0, questions: [] };

    var header = rows[0];
    var data = rows.slice(1);
    var questions = [];

    for (var col = 1; col < header.length; col++) {
      var valid = 0;
      var sum = 0;
      var blank = 0;
      var excluded = 0;
      for (var r = 0; r < data.length; r++) {
        var cell = data[r][col];
        var kind = classifyCell(cell);
        if (kind === 'valid') {
          valid += 1;
          sum += Number(String(cell).trim());
        } else if (kind === 'blank') {
          blank += 1;
        } else {
          excluded += 1;
        }
      }
      questions.push({
        name: String(header[col]).trim(),
        valid: valid,
        average: formatAverage(sum, valid),
        blank: blank,
        excluded: excluded
      });
    }
    return { respondents: data.length, questions: questions };
  }

  root.SurveyTally = {
    parseTsv: parseTsv,
    classifyCell: classifyCell,
    formatAverage: formatAverage,
    tally: tally
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>

<script id="tally-ui">
/* 화면: 입력창을 읽어 SurveyTally.tally()를 부르고 결과를 표로 그린다. 계산은 하지 않는다. */
(function () {
  'use strict';

  var input = document.getElementById('input');
  var result = document.getElementById('result');
  var clearButton = document.getElementById('clear');

  function make(tag, text, className) {
    var node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    if (className) node.className = className;
    return node;
  }

  function addRow(parent, cells, cellTag) {
    var tr = make('tr');
    cells.forEach(function (cell) {
      var node = make(cellTag, cell.text, cell.className);
      if (cellTag === 'th') node.setAttribute('scope', 'col');
      tr.appendChild(node);
    });
    parent.appendChild(tr);
  }

  function render() {
    var text = input.value;
    result.textContent = '';

    if (text.trim() === '') {
      result.appendChild(make('p', '결과가 여기에 표로 나타납니다.', 'hint'));
      return;
    }

    var data = SurveyTally.tally(text);
    if (data.questions.length === 0) {
      result.appendChild(make('p', '문항 열이 없습니다. 첫 열은 응답번호로 보고 집계하지 않으므로, 둘째 열부터 문항이 있어야 합니다.', 'hint'));
      return;
    }

    result.appendChild(make('p', '응답자 ' + data.respondents + '명 · 문항 ' + data.questions.length + '개', 'summary'));

    var table = make('table');
    var thead = make('thead');
    addRow(thead, [
      { text: '문항' },
      { text: '유효 응답', className: 'num' },
      { text: '평균', className: 'num' },
      { text: '빈 응답', className: 'num' },
      { text: '제외', className: 'num' }
    ], 'th');
    table.appendChild(thead);

    var tbody = make('tbody');
    data.questions.forEach(function (q) {
      addRow(tbody, [
        { text: q.name === '' ? '(이름 없음)' : q.name, className: 'name' },
        { text: String(q.valid), className: 'num' },
        { text: q.average, className: 'num' },
        { text: String(q.blank), className: 'num' },
        { text: String(q.excluded), className: 'num' }
      ], 'td');
    });
    table.appendChild(tbody);

    var wrap = make('div', undefined, 'table-wrap');
    wrap.appendChild(table);
    result.appendChild(wrap);
  }

  input.addEventListener('input', render);
  clearButton.addEventListener('click', function () {
    input.value = '';
    render();
    input.focus();
  });
  render();
})();
</script>
</body>
</html>
